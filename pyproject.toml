[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-mobility-predictor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.2,<2", "pyarrow>=18,<24", "pandas>=2.2,<4", "numpy>=1.26,<3",
  "geopandas>=1.0,<2", "requests>=2.32,<3", "scikit-learn>=1.5,<2",
  "simpy>=4.1,<5", "scipy>=1.14,<2", "torch>=2.4", "torch-geometric>=2.6,<3", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["mobility*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
